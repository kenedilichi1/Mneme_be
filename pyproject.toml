[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "mneme-be"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4.0",
    "aiofiles>=25.1.0",
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "boto3>=1.35",
    "docling>=2.130.0",
    "einops>=0.8.2",
    "fastapi[standard]>=0.141.1",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "PyJWT>=2.8.0",
    "resend>=2.45.0",
    "sentence-transformers>=3.3,<4",
    "sqlalchemy[asyncio]>=2.0.52",
    "torch>=2.9",
    "torchvision>=0.24",
    "transformers>=4.36,<5",
]

# CPU-only torch on Linux (Docker) avoids pulling ~GBs of CUDA wheels
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"


